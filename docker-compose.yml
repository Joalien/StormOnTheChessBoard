services:

  sotc-nginx:
    container_name: sotc-nginx
    image: nginx:alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - sotc-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sotc-net

  sotc-backend:
    container_name: sotc-backend
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ./pom.xml:/app/pom.xml
      - ./domain:/app/domain
      - ./repository:/app/repository
      - ./matchmaking:/app/matchmaking
      - ./controller:/app/controller
      - sotc-maven-cache:/root/.m2
    command: sh -c "mvn -N install && mvn -pl domain,repository,matchmaking install -DskipTests && mvn -pl controller spring-boot:run"
    networks:
      - sotc-net

  sotc-frontend:
    container_name: sotc-frontend
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./front:/app
      - sotc-node-modules:/app/node_modules
    environment:
      - CI=true
      - EXPO_NO_DOCTOR=1
    command: sh -c "npm install --omit=dev --legacy-peer-deps && npx expo start --web --host lan"
    networks:
      - sotc-net

  sotc-claude:
    container_name: sotc-claude
    build:
      context: .
      dockerfile: Dockerfile.claude
    user: "${UID}:${GID}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
      - ~/.gitconfig:/home/user/.gitconfig:ro
      - ~/.ssh:/home/user/.ssh:ro
    environment:
      - HOME=/home/user
    stdin_open: true
    tty: true
    extra_hosts:
      - "sotc-notifier:host-gateway"
    networks:
      - sotc-net

networks:
  sotc-net:
    driver: bridge

volumes:
  sotc-maven-cache:
  sotc-node-modules:
