<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mh1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <radialGradient id="mh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="80%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </radialGradient>
    <linearGradient id="mh3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Outer rim -->
  <ellipse cx="50" cy="52" rx="40" ry="36" fill="url(#mh1)" stroke="#BF360C" stroke-width="2"/>
  <!-- Inner hole -->
  <ellipse cx="50" cy="52" rx="30" ry="26" fill="url(#mh2)"/>
  <!-- Grate bars -->
  <line x1="30" y1="52" x2="70" y2="52" stroke="#8B4513" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="30" x2="50" y2="74" stroke="#8B4513" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="34" y1="36" x2="66" y2="68" stroke="#8B4513" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="66" y1="36" x2="34" y2="68" stroke="#8B4513" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Rim highlight -->
  <ellipse cx="50" cy="52" rx="40" ry="36" fill="none" stroke="#FFB300" stroke-width="1" opacity="0.3"/>
  <!-- Bolts -->
  <circle cx="50" cy="17" r="3.5" fill="url(#mh3)" stroke="#BF360C" stroke-width="1"/>
  <circle cx="50" cy="87" r="3.5" fill="url(#mh3)" stroke="#BF360C" stroke-width="1"/>
  <circle cx="14" cy="52" r="3.5" fill="url(#mh3)" stroke="#BF360C" stroke-width="1"/>
  <circle cx="86" cy="52" r="3.5" fill="url(#mh3)" stroke="#BF360C" stroke-width="1"/>
</svg>
