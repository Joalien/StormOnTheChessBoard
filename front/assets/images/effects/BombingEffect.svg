<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bo1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD740" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FF8F00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Blast glow -->
  <circle cx="50" cy="50" r="44" fill="url(#bo1)"/>
  <!-- Target rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#E65100" stroke-width="2" opacity="0.4"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#FF8F00" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="#FFB300" stroke-width="2" opacity="0.6"/>
  <!-- Crosshair -->
  <line x1="50" y1="8" x2="50" y2="28" stroke="#E65100" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="72" x2="50" y2="92" stroke="#E65100" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="8" y1="50" x2="28" y2="50" stroke="#E65100" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="72" y1="50" x2="92" y2="50" stroke="#E65100" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="url(#bo2)"/>
  <!-- Explosion sparks -->
  <line x1="50" y1="50" x2="20" y2="18" stroke="#FFD740" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="50" x2="82" y2="22" stroke="#FFD740" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="50" x2="80" y2="78" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="50" y1="50" x2="18" y2="76" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Sparkles -->
  <circle cx="20" cy="16" r="2" fill="#FFD740" opacity="0.7"/>
  <circle cx="83" cy="20" r="2" fill="#FFD740" opacity="0.7"/>
  <circle cx="82" cy="80" r="1.5" fill="#FFB300" opacity="0.6"/>
  <circle cx="16" cy="78" r="1.5" fill="#FFB300" opacity="0.6"/>
</svg>
