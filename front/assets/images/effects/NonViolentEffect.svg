<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Auréole positionnée au-dessus de la tête de la pièce -->
  <!-- Ombre légère (dépth) -->
  <ellipse cx="50" cy="20" rx="23" ry="8" fill="none" stroke="#b8860b" stroke-width="5" opacity="0.3"/>
  <!-- Auréole dorée -->
  <ellipse cx="50" cy="18" rx="23" ry="8" fill="none" stroke="#ffd700" stroke-width="3.5" opacity="0.95"/>
  <!-- Reflet intérieur (lueur blanche) -->
  <ellipse cx="50" cy="18" rx="23" ry="8" fill="none" stroke="#fffacd" stroke-width="1" opacity="0.6"/>
</svg>
