services:

  sotc-nginx:
    container_name: sotc-nginx
    image: nginx:alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - sotc-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sotc-net


  sotc-frontend:
    container_name: sotc-frontend
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../front:/app
      - sotc-node-modules:/app/node_modules
    environment:
      - CI=true
    command: sh -c "npm install --legacy-peer-deps && npx expo start --web --host lan"
    networks:
      - sotc-net

  sotc-claude:
    container_name: sotc-claude
    build:
      context: ..
      dockerfile: ops/Dockerfile.claude
    user: "${UID}:${GID}"
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
      - ~/.gitconfig:/home/user/.gitconfig:ro
      - ~/.ssh:/home/user/.ssh:ro
    environment:
      - HOME=/home/user
    stdin_open: true
    tty: true
    extra_hosts:
      - "sotc-notifier:host-gateway"
    networks:
      - sotc-net

networks:
  sotc-net:
    driver: bridge

volumes:
  sotc-node-modules:
